name: ArgMojo Unit Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

defaults:
  run:
    shell: bash

# Every Mojo command runs through .github/scripts/run.sh: it applies a
# per-command timeout and retries only when the command is killed by a
# signal (a compiler crash or the timeout), never when a test fails.
# Tests import the argmojo.mojoc that setup-mojo builds (`-I .`).

jobs:
  # ── Job 1: Format + Docs + Package ─────────────────────────────────────
  # If this job fails, the later test jobs will be skipped,
  # so we can save time by checking formatting and packaging first.
  build:
    name: Build & Format
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.5
        with:
          cache: true
      - name: Format check
        run: |
          pixi run format
          if ! git diff --exit-code; then
            echo "::error::Code is not formatted. Run 'pixi run format' locally."
            exit 1
          fi
      - name: Docstring check
        run: .github/scripts/run.sh pixi run doc
      - name: Build package
        run: .github/scripts/run.sh pixi run package

  # ── Job 2: Core parsing tests ──────────────────────────────────────────
  test-core:
    name: "Test: Core Parsing"
    needs: build
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-mojo
      - name: Run core tests
        run: |
          .github/scripts/run.sh mojo run -I . -D ASSERT=all tests/test_parse.mojo
          .github/scripts/run.sh mojo run -I . -D ASSERT=all tests/test_options.mojo
          .github/scripts/run.sh mojo run -I . -D ASSERT=all tests/test_response_file.mojo
          .github/scripts/run.sh mojo run -I . -D ASSERT=all tests/test_groups.mojo

  # ── Job 3: Feature tests ───────────────────────────────────────────────
  test-features:
    name: "Test: Features"
    needs: build
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-mojo
      - name: Run feature tests
        run: |
          .github/scripts/run.sh mojo run -I . -D ASSERT=all tests/test_help.mojo
          .github/scripts/run.sh mojo run -I . -D ASSERT=all tests/test_completion.mojo
          .github/scripts/run.sh mojo run -I . -D ASSERT=all tests/test_interactive.mojo < /dev/null
          .github/scripts/run.sh mojo run -I . -D ASSERT=all tests/test_wrappers.mojo
      - name: Run terminal (pty) checks
        run: .github/scripts/run.sh bash tests/check_tty.sh

  # ── Job 4: Declarative API tests ───────────────────────────────────────
  test-declarative:
    name: "Test: Declarative API"
    needs: build
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-mojo
      - name: Run declarative tests
        run: |
          .github/scripts/run.sh mojo run -I . -D ASSERT=all tests/test_declarative.mojo
          .github/scripts/run.sh mojo run -I . -D ASSERT=all tests/test_hybrid.mojo
          .github/scripts/run.sh mojo run -I . -D ASSERT=all tests/test_subcommands.mojo
          .github/scripts/run.sh mojo run -I . -D ASSERT=all tests/test_subcommands_declarative.mojo
          .github/scripts/run.sh mojo run -I . -D ASSERT=all tests/test_dispatch.mojo
          .github/scripts/run.sh mojo run -I . -D ASSERT=all tests/test_schema_validation.mojo
          .github/scripts/run.sh bash tests/check_schema_errors.sh

  # ── Job 5: Example binaries ────────────────────────────────────────────
  test-examples:
    name: "Test: Examples"
    needs: build
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-mojo
      - name: Build example binaries
        run: .github/scripts/run.sh pixi run build

  # ── Job 6: Linux ───────────────────────────────────────────────────────
  # The other jobs run on macOS. Linux has its own termios layout and
  # ioctl numbers, so the whole suite runs here too, pty checks included.
  test-linux:
    name: "Test: Linux"
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.5
        with:
          cache: true
          activate-environment: true
      - name: Run all tests
        env:
          RUN_TIMEOUT: "2100"
        run: .github/scripts/run.sh pixi run test
